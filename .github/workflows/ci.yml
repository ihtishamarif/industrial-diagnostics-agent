name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp,modbus]"
      - run: pytest
      - run: diagagent demo --backend offline --approve yes --out results
      - run: diagagent demo --backend offline --device modbus --approve yes --out results_modbus
